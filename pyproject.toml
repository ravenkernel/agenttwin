[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttwin"
version = "0.1.2"
description = "Frozen-replay for LLM agents: record one JSONL tape, replay it deterministically, diff what changed."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["llm", "agents", "replay", "record", "determinism", "testing"]
authors = [{ name = "ravenkernel" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ravenkernel/agenttwin"
Source = "https://github.com/ravenkernel/agenttwin"
Issues = "https://github.com/ravenkernel/agenttwin/issues"
Changelog = "https://github.com/ravenkernel/agenttwin/blob/main/CHANGELOG.md"

[project.optional-dependencies]
yaml = ["pyyaml"]
dev = ["pytest>=7", "coverage>=7"]

[project.scripts]
agenttwin = "agenttwin.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenttwin = ["html/*.html", "fixtures/*.jsonl"]

# The floor promised by both READMEs and by .github/workflows/ci.yml.  It is a
# tripwire against a whole module losing its tests, not a target: the suite runs
# at 94% today, and the CI job prints that real figure next to the gate.
[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 82
show_missing = true
